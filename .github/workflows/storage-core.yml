name: Native storage core
on:
  push:
    paths: ['poc/storage-core/**', '.github/workflows/storage-core.yml']
  pull_request:
    paths: ['poc/storage-core/**', '.github/workflows/storage-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.1
          rustup target add x86_64-unknown-none aarch64-unknown-none
      - name: Recovery and persistence
        run: |
          cargo fmt --manifest-path poc/storage-core/Cargo.toml --check
          cargo test --locked --manifest-path poc/storage-core/Cargo.toml
          cargo clippy --locked --manifest-path poc/storage-core/Cargo.toml --all-targets -- -D warnings
          cargo check --locked --manifest-path poc/storage-core/Cargo.toml --target x86_64-unknown-none
          cargo check --locked --manifest-path poc/storage-core/Cargo.toml --target aarch64-unknown-none
