name: Native persistence release gate
on:
  push:
    branches: [main]
    paths: ['poc/m5_executor/**', 'poc/storage-core/**', 'scripts/verify-lfs-hardware*', 'run-velaos.sh', '.github/workflows/hardware-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned host Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build Microkit and prove two cold boots
        run: bash run-velaos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: velaos-persistence-evidence
          path: |
            .local/boot-*/proof/*.log
            .local/boot-*/proof/result.json
          include-hidden-files: true
          if-no-files-found: warn
