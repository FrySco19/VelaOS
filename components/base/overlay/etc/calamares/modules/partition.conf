# Vela: Btrfs by default (snapshots with snapper), EFI 512 MiB, no swap partition (zram is used).
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 64MiB
    label: "EFI"
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
    - small
    - suspend
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: erase
initialEncryptionChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
partitionLayout:
    - name: "vela"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
