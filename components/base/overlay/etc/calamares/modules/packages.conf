# Vela: remove live-only packages and the installer from the installed system.
---
backend: apt
skip_if_no_internet: false
update_db: false
operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
