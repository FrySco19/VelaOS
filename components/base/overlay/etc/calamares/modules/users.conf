# Vela: user creation (based on Debian's), sudo group, hostname from user name.
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: true
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "vela-${first}"
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /usr/bin/fish
  forbidden_names: [ root ]
