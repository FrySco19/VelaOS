{
  "version": 1,
  "enabled": true,
  "provider": "openai",
  "ollama": {
    "base_url": "http://127.0.0.1:11434",
    "model": "qwen2.5:1.5b"
  },
  "openai": {
    "base_url": "http://127.0.0.1:11435/v1",
    "model": "vela-local",
    "organization": ""
  },
  "generation": {
    "temperature": 0.1,
    "max_tokens": 384,
    "timeout_s": 180
  },
  "language": "auto",
  "assistant": {
    "shortcut": "Meta+A",
    "history": true,
    "tray": true
  },
  "permissions": {
    "active_window": true,
    "selected_text": true,
    "clipboard": false,
    "files": "ask",
    "screen": "ask",
    "microphone": "ask",
    "web": "ask",
    "run_commands": "never",
    "network_settings": "ask",
    "system_changes": "ask"
  },
  "privacy": {
    "allow_cloud": false,
    "log_actions": true,
    "log_retention_days": 30,
    "memory_enabled": true,
    "memory_paused": false,
    "memory_exclude_paths": [
      "~/.ssh",
      "~/.gnupg",
      "~/.local/share/keyrings"
    ],
    "memory_exclude_sites": [],
    "redact_secrets": true
  }
}
