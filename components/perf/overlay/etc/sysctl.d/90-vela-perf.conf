# Vela perf — memory tuned for zram swap (values used by Fedora/Pop!_OS for zram setups)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# keep directory/inode caches a bit longer: faster file manager and app start
vm.vfs_cache_pressure = 50
# many watched folders (file manager, IDEs, indexer)
fs.inotify.max_user_watches = 524288
# no NMI watchdog: useless in VMs, small CPU cost
kernel.nmi_watchdog = 0
