[package]
name = "vela-executor-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false
description = "Host-side (std test harness) model of the M5 Executor admission + Wasmi path, for EXECUTOR_CONTRACT.md contract tests"

[dependencies]
# Same pins and feature set as poc/m5_executor/app (guest), so host tests run the same interpreter.
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "validate", "prefer-btree-collections", "portable-dispatch"] }
ed25519-compact = { version = "=2.6.0", default-features = false }

[dev-dependencies]
wat = "=1.261.0"

# No wasmi profile override: with portable-dispatch (R1 fix, EXECUTOR_CONTRACT E8) Wasmi's
# dispatch loop is constant-native-stack at every opt-level, so the default dev profile
# (opt 0, debug assertions) is the strictest configuration and is what tests/r1_max_fuel.rs runs in.
