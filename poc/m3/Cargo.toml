[package]
name = "vela-control-plane-m3"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[dependencies]
anyhow = "=1.0.100"
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["datalog-macro"] }
blake3 = "=1.8.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.8.2"

[[bin]]
name = "planner-probe"
path = "src/bin/planner_probe.rs"
