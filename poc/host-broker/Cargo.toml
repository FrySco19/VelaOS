[package]
name = "vela-host-broker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vela-protocol = { path = "../protocol" }
vela-selection-contract = { path = "../selection-contract" }
ed25519-compact = { version = "=2.6.0", default-features = false }
sha2 = "=0.10.9"
getrandom = "=0.2.17"
tungstenite = "=0.28.0"
serde_json = "=1.0.145"
vela-note-action = { path = "../note-action" }
ed25519-dalek = { version = "=2.2.0", default-features = false }

authenticator = { version = "=0.5.0", default-features = false, features = ["crypto_rust"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = '=0.3.9', features = ['std'] }
