[package]
name = "vela-host-broker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vela-protocol = { path = "../protocol" }
vela-selection-contract = { path = "../selection-contract" }
ed25519-compact = { version = "=2.6.0", default-features = false }
sha2 = "=0.10.9"
getrandom = "=0.2.17"
tungstenite = "=0.28.0"
serde_json = "=1.0.145"
vela-note-action = { path = "../note-action" }
ed25519-dalek = { version = "=2.2.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
