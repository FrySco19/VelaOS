[package]
name = "vela-neural-bus-m2"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[features]
fixture-e2e = ["vela-lfs-m1/fault-fixtures"]

[dependencies]
anyhow = "=1.0.100"
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["datalog-macro"] }
blake3 = "=1.8.2"
iceoryx2 = "=0.10.0"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
subtle = "=2.6.1"
tempfile = "=3.23.0"
vela-lfs-m1 = { path = "../m1" }
zeroize = "=1.8.2"
wasmtime = { version = "=36.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }

[[bin]]
name = "bus-spike"
path = "src/bin/bus_spike.rs"
required-features = ["fixture-e2e"]
