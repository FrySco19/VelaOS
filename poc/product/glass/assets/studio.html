<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:7990; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Vela</title>
  <style>
    /* Tokens */
    :root {
      color-scheme: dark;
      --canvas: #0a0d12;
      --surface: #121720;
      --elevated: #151b26;
      --hash-surface: #0d1118;
      --button-surface: #1a212d;
      --border: rgba(255,255,255,.06);
      --highlight: inset 0 1px 0 rgba(255,255,255,.04);
      --text: #e8ebf1;
      --secondary: #8a93a6;
      --tertiary: #788398;
      --accent: #8fa8d9;
      --focus: rgba(143,168,217,.55);
      --success: #6fb58f;
      --error: #d9776f;
      --sans: -apple-system,"SF Pro Text","Inter",system-ui,sans-serif;
      --mono: ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",monospace;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
      --s5: 24px; --s6: 32px; --s7: 48px;
      --bar-radius: 14px; --card-radius: 12px; --button-radius: 10px;
      --row-radius: 8px; --pill-radius: 999px;
      --bar-shadow: 0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.28),0 24px 64px rgba(0,0,0,.22);
      --modal-shadow: 0 2px 4px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.40),0 48px 120px rgba(0,0,0,.50);
      --enter: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; overflow: hidden; background: var(--canvas); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button,input,textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    [hidden] { display: none; }
    :focus-visible { outline: 1px solid var(--accent); outline-offset: var(--s1); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* Canvas and command surface */
    .shell { width: min(640px,calc(100% - 32px)); margin: 0 auto; padding-top: min(31dvh,280px); }
    .command { position: relative; height: 56px; border: 1px solid var(--border); border-radius: var(--bar-radius); background: var(--surface); box-shadow: var(--highlight),var(--bar-shadow); overflow: hidden; }
    .command:focus-within { box-shadow: 0 0 0 1px var(--focus),var(--highlight),var(--bar-shadow); }
    .command.document { height: 200px; }
    .document-context { font-size: 12px; color: var(--secondary); overflow-wrap: anywhere; margin-bottom: 16px; }
    .intent { font-family: inherit; line-height: 1.5; resize: none;  width: 100%; height: 100%; border: 0; outline: 0; background: transparent; color: var(--text); padding: 14px 20px; font-size: 18px; font-weight: 400; letter-spacing: -.01em; caret-color: var(--accent); }
    .intent::placeholder { color: var(--tertiary); opacity: 1; }
    .processing { position: absolute; right: 20px; top: 25px; display: flex; gap: var(--s1); pointer-events: none; }
    .processing[hidden] { display: none; }
    .processing i { width: 4px; height: 4px; border-radius: var(--pill-radius); background: var(--secondary); animation: pulse 800ms ease-out infinite alternate; }
    .processing i:nth-child(2) { animation-delay: 120ms; }
    .processing i:nth-child(3) { animation-delay: 240ms; }
    .filters { display: flex; justify-content: center; gap: var(--s1); margin-top: var(--s4); }
    .pill { height: 28px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--pill-radius); background: transparent; color: var(--secondary); font-size: 12px; font-weight: 500; }
    .pill:hover { background: rgba(255,255,255,.04); }
    .pill[aria-selected="true"] { background: var(--surface); border-color: rgba(143,168,217,.18); color: var(--text); box-shadow: var(--highlight); }
    .feed { list-style: none; padding: 0 0 var(--s7); margin: var(--s5) 0 0; max-height: min(528px,calc(69dvh - 148px)); overflow-y: auto; scrollbar-width: none; mask-image: linear-gradient(to bottom,#000 0%,#000 65%,transparent 100%); -webkit-mask-image: linear-gradient(to bottom,#000 0%,#000 65%,transparent 100%); }
    .feed::-webkit-scrollbar { display: none; }
    .entry { border-radius: var(--row-radius); }
    .entry.new { animation: row-enter 200ms var(--enter); }
    .entry:hover { background: rgba(255,255,255,.03); }
    .entry details > summary { list-style: none; cursor: pointer; }
    .entry details > summary::-webkit-details-marker { display: none; }
    .entry-line { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s3); }
    .dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: var(--pill-radius); background: var(--tertiary); }
    .dot.success { background: var(--success); }
    .entry-label { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .entry-time { color: var(--tertiary); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .receipt-detail { display: grid; grid-template-columns: 72px 1fr; gap: var(--s2); margin: 0; padding: var(--s3) var(--s5) var(--s4); font-size: 12px; line-height: 1.7; }
    .receipt-detail dt { color: var(--secondary); }
    .receipt-detail dd { margin: 0; overflow-wrap: anywhere; }
    .receipt-detail code { font-family: var(--mono); font-size: 11px; }
    .feed.exiting { animation: fade-out 120ms ease-out forwards; }
    .feed.entering { animation: filter-enter 140ms var(--enter); }
    .connection { position: fixed; top: 20px; right: 20px; width: 6px; height: 6px; border-radius: var(--pill-radius); background: var(--tertiary); }
    .connection[data-state="connected"] { background: var(--success); }
    .connection[data-state="failed"] { background: var(--error); }

    /* Approval surface */
    .approval { width: min(480px,calc(100% - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 28px; border: 1px solid var(--border); border-radius: var(--card-radius); background: var(--elevated); color: var(--text); box-shadow: var(--highlight),var(--modal-shadow); animation: modal-enter 200ms var(--enter); }
    .approval::backdrop { background: rgba(4,6,9,.66); backdrop-filter: blur(6px); animation: fade-in 180ms var(--enter); }
    .approval.leaving { animation: fade-out 160ms ease-out forwards; }
    .approval.leaving::backdrop { animation: fade-out 160ms ease-out forwards; }
    .proposal-label { margin: 0 0 20px; color: var(--secondary); font-size: 11px; font-weight: 500; letter-spacing: .08em; }
    .approval h1 { margin: 0 0 20px; font-size: 17px; font-weight: 600; line-height: 1.45; }
    .draft { display: block; width: 100%; min-height: 88px; max-height: 160px; resize: vertical; border: 1px solid var(--border); border-radius: var(--row-radius); padding: var(--s3); background: var(--hash-surface); color: var(--text); caret-color: var(--accent); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
    .parameters { display: grid; grid-template-columns: 64px 1fr; gap: var(--s2); font-size: 12px; color: var(--secondary); margin: 0 0 20px; }
    .parameters dd { margin: 0; color: var(--text); }
    .hash-label { display: block; color: var(--secondary); font-size: 11px; letter-spacing: .08em; margin-bottom: var(--s2); }
    .hash { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: var(--s1); padding: 14px; border: 1px solid var(--border); border-radius: var(--row-radius); background: var(--hash-surface); font-family: var(--mono); font-size: 13px; line-height: 1.7; letter-spacing: .02em; user-select: all; margin-bottom: 20px; }
    .hash span { white-space: nowrap; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
    .button { height: 48px; padding: 0 var(--s2); border: 1px solid rgba(255,255,255,.08); border-radius: var(--button-radius); background: var(--button-surface); color: var(--secondary); font-size: 12px; font-weight: 600; letter-spacing: .04em; box-shadow: inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.4); }
    .button:hover { color: var(--text); }
    .button:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
    .authorize { background: var(--text); color: var(--canvas); }
    .authorize:hover { color: var(--canvas); }
    .button-progress { width: 14px; height: 14px; display: inline-block; border: 1px solid var(--canvas); border-radius: var(--pill-radius); border-right-color: transparent; animation: spin 800ms linear infinite; }
    .button-progress[hidden] { display: none; }
    .toast { position: fixed; left: 50%; bottom: var(--s6); transform: translateX(-50%); max-width: calc(100% - 32px); min-height: 40px; display: flex; align-items: center; padding: var(--s2) var(--s4); border: 1px solid var(--border); border-radius: var(--button-radius); background: var(--surface); box-shadow: var(--bar-shadow); color: var(--text); font-size: 13px; animation: fade-in 160ms var(--enter); text-align: center; }
    .toast[hidden] { display: none; }
    .toast.leaving { animation: fade-out 160ms ease-out forwards; }
    @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes modal-enter { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
    @keyframes row-enter { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes filter-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fade-out { to { opacity: 0; } }
    @media(max-width:519px) { .approval { padding: var(--s4); } .hash { letter-spacing: 0; font-size: 12px; } .button { font-size: 11px; letter-spacing: 0; } }
    @media(max-height:600px) { .shell { padding-top: 20dvh; } .feed { max-height: calc(80dvh - 148px); } }
    @media(prefers-reduced-motion:reduce) { .entry.new,.approval,.feed.entering { animation: fade-in 60ms ease-out; } .approval::backdrop,.toast { animation-duration: 60ms; } .feed.exiting,.approval.leaving,.approval.leaving::backdrop,.toast.leaving { animation-duration: 60ms; } .button:active { transform: none; } .processing i,.button-progress { animation: none; } }
  </style>
</head>
<body>
  <span id="connection" class="connection" data-state="idle" title="Disconnesso" role="img" aria-label="Disconnesso"></span>
  <main class="shell" id="shell">
    <form id="intentForm" class="command">
      <textarea rows="2" id="intent" class="intent" aria-label="Qual è il tuo intento?" placeholder="Qual è il tuo intento?" autocomplete="off" maxlength="1024" autofocus></textarea>
      <span id="processing" class="processing" hidden aria-hidden="true"><i></i><i></i><i></i></span>
    </form>
    <nav class="filters" role="tablist" aria-label="Contesti">
      <button id="tab-all" class="pill" role="tab" aria-selected="true" aria-controls="timelinePanel" data-context="Tutto">Tutto</button>
      <button id="tab-work" class="pill" role="tab" aria-selected="false" aria-controls="timelinePanel" data-context="Lavoro" tabindex="-1">Lavoro</button>
      <button id="tab-system" class="pill" role="tab" aria-selected="false" aria-controls="timelinePanel" data-context="Sistema" tabindex="-1">Sistema</button>
    </nav>
    <section id="timelinePanel" role="tabpanel" aria-labelledby="tab-all"><ul id="timeline" class="feed" aria-label="Cronologia" aria-live="polite"></ul></section>
  </main>
  <dialog id="approval" class="approval" aria-modal="true" aria-labelledby="approvalTitle" aria-describedby="effect">
    <p class="proposal-label">PROPOSTA</p>
    <h1 id="approvalTitle">Salva la nota</h1>
    <p id="documentContext" class="document-context"></p>
    <label for="draft" class="sr-only">Contenuto della nota</label>
    <textarea id="draft" class="draft" maxlength="1024" spellcheck="false"></textarea>
    <dl class="parameters"><dt>Effetto</dt><dd id="effect">Sostituisce la nota precedente</dd></dl>
    <span class="hash-label">SHA-256</span><code id="planDigest" class="hash"></code>
    <div class="buttons">
      <button id="reject" class="button" type="button" autofocus>RIFIUTA</button>
      <button id="approve" class="button authorize" type="button" aria-label="Autorizza e firma" disabled><span id="approveLabel">AUTORIZZA E FIRMA</span><span id="buttonProgress" class="button-progress" hidden aria-hidden="true"></span></button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    'use strict';
    /* Existing broker contract and cryptographic checks are unchanged. */
    const $ = id => document.getElementById(id), encoder = new TextEncoder();
    const receipts = [], transactionIds = new Set();
    let editing = null;
    let phase = 'Idle', revision = 0, digestRevision = 0, filter = 'Tutto', currentIntent = '', socket = null;
    let toastTimer, filterTimer, closing = false;
    const hex = bytes => Array.from(bytes,b => b.toString(16).padStart(2,'0')).join('');
    const sha = async bytes => hex(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)));
    const duration = normal => matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : normal;

    /* Presentation */
    function toast(text) {
      clearTimeout(toastTimer); $('toast').classList.remove('leaving'); $('toast').textContent = text; $('toast').hidden = false;
      toastTimer = setTimeout(() => { $('toast').classList.add('leaving'); toastTimer = setTimeout(() => { $('toast').hidden = true; },duration(160)); },3000);
    }
    function connection(state) {
      const label = state === 'connected' ? 'Connesso' : state === 'connecting' ? 'Riconnessione…' : 'Disconnesso';
      $('connection').dataset.state = state; $('connection').title = label; $('connection').setAttribute('aria-label',label);
    }
    function showHash(digest) {
      $('planDigest').replaceChildren(); $('planDigest').setAttribute('aria-label',digest);
      for (const group of digest.match(/.{8}/g) || []) { const span = document.createElement('span'); span.textContent = group; $('planDigest').append(span); }
    }
    function lock(locked) {
      $('intent').disabled = locked; $('draft').disabled = locked; $('approve').disabled = locked;
      $('approve').setAttribute('aria-busy',String(locked)); $('approve').setAttribute('aria-label',locked ? 'Firma e salvataggio in corso' : 'Autorizza e firma'); $('approveLabel').hidden = locked; $('buttonProgress').hidden = !locked;
      $('processing').hidden = !locked;
    }
    async function closeModal() {
      if (!$('approval').open || closing) return;
      closing = true; $('approval').classList.add('leaving');
      await new Promise(resolve => setTimeout(resolve,duration(160)));
      $('approval').close(); $('approval').classList.remove('leaving'); closing = false;
      if (phase !== 'Loading') $('intent').focus();
    }
    function timeLabel(date) {
      const now = new Date(), yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
      if (date.toDateString() === now.toDateString()) return date.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      if (date.toDateString() === yesterday.toDateString()) return 'ieri';
      return date.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});
    }
    function renderTimeline(enterNew = false) {
      $('timeline').replaceChildren();
      for (const item of receipts.filter(r => filter === 'Tutto' || r.context === filter)) {
        const li = document.createElement('li'); li.dataset.id=item.id; li.className = enterNew && item === receipts[0] ? 'entry new' : 'entry';
        const details = document.createElement('details'), summary = document.createElement('summary'); summary.className = 'entry-line';
        const dot = document.createElement('span'); dot.className = 'dot success'; dot.setAttribute('aria-hidden','true');
        const label = document.createElement('span'); label.className = 'entry-label'; label.textContent = item.preview || 'Nota salvata';
        const time = document.createElement('time'); time.className = 'entry-time'; time.textContent = timeLabel(item.timestamp); time.dateTime = item.timestamp.toISOString();
        label.textContent=(item.parent_id && !/^0+$/.test(item.parent_id)?'Versione aggiornata · ':'')+label.textContent;
        summary.append(dot,label,time);
        summary.addEventListener('click',event=>{event.preventDefault();openNote(item).catch(()=>toast('Documento non disponibile.'));});
        // Preserve the previous receipt-detail affordance without raw IDs/JSON.
        const data = document.createElement('dl'); data.className = 'receipt-detail';
        for (const [name,value,mono] of [['Esito','Eseguita',false],['Consenso',item.consent === 'Unrecorded' ? 'Non registrato' : item.consent === 'WindowsVerified' ? 'Verificato sul dispositivo' : 'Di sviluppo',false],['SHA-256',item.note_sha256,true],['Firma',item.receipt_hex.slice(-128),true]]) {
          const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = name;
          if (mono) { const code = document.createElement('code'); code.textContent = value; dd.append(code); } else dd.textContent = value;
          data.append(dt,dd);
        }
        details.append(summary,data); li.append(details); $('timeline').append(li);
      }
    }
    function selectTab(tab) {
      filter = tab.dataset.context;
      for (const item of document.querySelectorAll('[data-context]')) { item.setAttribute('aria-selected',String(item === tab)); item.tabIndex = item === tab ? 0 : -1; }
      $('timelinePanel').setAttribute('aria-labelledby',tab.id);
      clearTimeout(filterTimer); $('timeline').classList.remove('entering'); $('timeline').classList.add('exiting');
      filterTimer = setTimeout(() => { renderTimeline(); $('timeline').classList.remove('exiting'); $('timeline').classList.add('entering'); filterTimer = setTimeout(() => $('timeline').classList.remove('entering'),duration(140)); },duration(120));
    }
    async function updateDigest() {
      const run = ++digestRevision, bytes = encoder.encode($('draft').value); $('approve').disabled = true;
      if (bytes.length > 1024) { $('planDigest').replaceChildren(); $('planDigest').removeAttribute('aria-label'); toast('La nota è troppo lunga.'); return; }
      const digest = await sha(bytes);
      if (run !== digestRevision || phase !== 'Preview') return;
      showHash(digest); $('approve').disabled = false;
    }

    /* Proposal, rejection and the original one-shot transport */
    async function propose(event) {
      event.preventDefault(); if (event.isComposing || phase === 'Loading' || phase === 'Reading' || phase === 'Interpreting' || phase === 'Preview') return;
      const intent = $('intent').value; if (!intent.trim()) return;
      currentIntent = editing ? 'Aggiorna documento selezionato' : 'Crea una nota'; phase = 'Interpreting'; revision++; $('intent').value = ''; $('intent').disabled = true; $('processing').hidden = false;
      // No inbound Proposal exists in this protocol: preserve local preparation.
      await new Promise(resolve => setTimeout(resolve,180));
      $('documentContext').textContent=editing ? 'Aggiornamento immutabile · Documento '+editing.document_id+' · Versione di origine '+editing.id : 'Nuovo documento · La nota esistente non viene sostituita';
      $('draft').value = intent; phase = 'Preview'; $('processing').hidden = true; $('intent').disabled = false;
      $('approval').showModal(); $('reject').focus();
      await updateDigest();
    }
    async function reject() {
      if (phase === 'Loading') { await closeModal(); toast('Operazione già inviata.'); return; }
      editing=null;$('intentForm').classList.remove('document'); ++digestRevision; phase = 'Idle'; await closeModal(); $('draft').value = ''; $('intent').value = ''; $('intent').focus();
    }
    async function authorize() {
      if (phase !== 'Preview' || closing) return;
      const note = $('draft').value, bytes = encoder.encode(note);
      // Current operation is always write-note: it belongs to Lavoro. Filters
      // are presentation only and cannot manufacture a system operation.
      const context = 'Lavoro';
      if (bytes.length > 1024) { toast('La nota è troppo lunga.'); return; }
      phase = 'Loading'; ++digestRevision; lock(true);
      let digest;
      try {
        digest = await sha(bytes); showHash(digest);
        const receipt = await new Promise((resolve,rejectPromise) => {
          socket = new WebSocket('ws://127.0.0.1:7990/'); connection('connecting'); let settled = false;
          const finish = (error,value) => { if (settled) return; settled = true; clearTimeout(timer); const active = socket; socket = null; active?.close(); error ? rejectPromise(error) : resolve(value); };
          const timer = setTimeout(() => { connection('failed'); finish(new Error('Timeout: esito del salvataggio sconosciuto. Non ripetere automaticamente.')); },180000);
          socket.onopen = () => { connection('connected'); socket.send(JSON.stringify({type:'Proposal',operation:'write-note',intent:currentIntent,note,note_sha256:digest,...(editing?{document_id:editing.document_id,parent_id:editing.id}:{})})); };
          socket.onerror = () => { connection('failed'); finish(new Error('Broker locale non disponibile.')); };
          socket.onclose = () => { if (!settled) connection('failed'); else if ($('connection').dataset.state !== 'failed') connection('idle'); finish(new Error('Connessione chiusa senza ricevuta: esito sconosciuto.')); };
          socket.onmessage = event => {
            let message; try { message = JSON.parse(event.data); } catch { finish(new Error('Risposta broker non valida.')); return; }
            if (message.type === 'ListResponse') { try { hydrate(message); } catch { finish(new Error('Indice non valido')); } return; }
            if (message.type === 'Ack' || message.type === 'Progress') return;
            if (message.type === 'Denied') { finish(new Error(message.reason || 'Richiesta negata.')); return; }
            finish(null,message);
          };
        });
        if (receipt.type !== 'Receipt' || receipt.verified !== true || receipt.note_sha256 !== digest || !/^\d+$/.test(receipt.request) || !/^[0-9a-f]{340}$/.test(receipt.receipt_hex) || !['WindowsVerified','ConsoleDevelopment','MockUnavailableDevelopment'].includes(receipt.consent)) throw new Error('Ricevuta non coerente con la proposta.');
        const raw = Uint8Array.from(receipt.receipt_hex.match(/../g),v => parseInt(v,16)), view = new DataView(raw.buffer);
        if (view.getUint16(0,true) !== 1 || view.getBigUint64(10,true).toString() !== receipt.request || view.getBigUint64(18,true) === 0n || hex(raw.slice(26,58)) !== digest) throw new Error('Identità della ricevuta non valida.');
        if (transactionIds.has(receipt.request)) throw new Error('Ricevuta duplicata.');
        transactionIds.add(receipt.request); receipts.unshift({...receipt,context,timestamp:new Date()});
        editing=null;$('intentForm').classList.remove('document'); phase = 'Completed'; await closeModal(); $('draft').value = ''; $('intent').value = ''; renderTimeline(true);
        if (receipt.consent !== 'WindowsVerified') toast('Salvato con consenso di sviluppo.');
        window.dispatchEvent(new CustomEvent('vela:completed',{detail:receipt}));
      } catch (error) {
        phase = 'Preview';
        const unavailable = error.message.includes('disponibile');
        toast(unavailable ? 'Connessione non disponibile.' : 'Salvataggio non confermato.');
      } finally {
        lock(false);
        if (phase === 'Preview' && $('approval').open) await updateDigest();
        else if (phase === 'Preview') { phase = 'Idle'; $('intent').focus(); }
        else $('intent').focus();
      }
    }

    /* Keyboard and focus */
    $('intentForm').addEventListener('submit',propose);
    $('intent').addEventListener('keydown',event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); if (!event.isComposing && event.keyCode !== 229) propose(event); }
      if (event.key === 'Escape') { event.preventDefault(); $('intent').value = ''; editing=null;$('intentForm').classList.remove('document'); }
    });
    $('draft').addEventListener('input',() => { if (phase === 'Preview') { revision++; updateDigest().catch(() => toast('Verifica non disponibile.')); } });
    $('approve').addEventListener('click',authorize); $('reject').addEventListener('click',reject);
    $('approval').addEventListener('cancel',event => { event.preventDefault(); reject(); });
    $('approval').addEventListener('keydown',event => {
      if (event.key === 'Enter' && event.target !== $('approve') && event.target !== $('reject') && event.target !== $('draft')) event.preventDefault();
      if (event.key !== 'Tab') return;
      const nodes = [...$('approval').querySelectorAll('button,textarea')].filter(node => !node.disabled);
      const first = nodes[0], last = nodes.at(-1);
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    const tabs = [...document.querySelectorAll('[data-context]')];
    for (const tab of tabs) {
      tab.addEventListener('click',() => selectTab(tab));
      tab.addEventListener('keydown',event => {
        if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault(); const index = tabs.indexOf(tab);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length-1 : (index+(event.key === 'ArrowRight' ? 1 : -1)+tabs.length)%tabs.length;
        tabs[next].focus(); selectTab(tabs[next]);
      });
    }
    document.addEventListener('keydown',event => { if ((event.altKey && event.code === 'Space') || ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k')) { event.preventDefault(); if (!$('approval').open && phase !== 'Loading') $('intent').focus(); } });
    async function openNote(item) {
      if(phase!=='Idle' && phase!=='Completed')return;
      phase='Reading';lock(true);
      try {
        const result=await new Promise((resolve,reject)=>{
          const ws=new WebSocket('ws://127.0.0.1:7990/');let done=false;
          const finish=(error,value)=>{if(done)return;done=true;clearTimeout(timer);ws.close();error?reject(error):resolve(value);};
          const timer=setTimeout(()=>finish(new Error('Read timeout')),30000);
          ws.onopen=()=>ws.send(JSON.stringify({type:'ReadRequest',id:item.id}));
          ws.onerror=()=>finish(new Error('Broker unavailable'));
          ws.onclose=()=>finish(new Error('Read disconnected'));
          ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='ListResponse'){hydrate(m);return;}if(m.type!=='ReadResponse'||m.verified!==true||!m.entry)throw new Error('Read denied');finish(null,m.entry);}catch(error){finish(error);}};
        });
        if(result.id!==item.id || result.receipt_hex!==item.receipt_hex || typeof result.note!=='string' || encoder.encode(result.note).length>1024 || await sha(encoder.encode(result.note))!==item.note_sha256)throw new Error('Read proof mismatch');
        editing=result;$('intentForm').classList.add('document');$('intent').dataset.document=result.document_id;$('intent').value=result.note;$('intent').scrollTop=0;$('intent').focus();
        window.dispatchEvent(new CustomEvent('vela:opened',{detail:{id:result.id}}));
      } finally {phase='Idle';lock(false);$('intent').focus();}
    }
    function hydrate(message) {
      if(message.verified!==true||!Array.isArray(message.notes)||message.notes.length>64)throw new Error('Indice non valido');
      for(const note of message.notes){
        if(!/^[0-9a-f]{32}$/.test(note.document_id)||!/^[0-9a-f]{32}$/.test(note.parent_id)||note.verified!==true||!/^\d+$/.test(note.request)||!/^[0-9a-f]{340}$/.test(note.receipt_hex)||!/^[0-9a-f]{64}$/.test(note.note_sha256)||typeof note.preview!=='string'||note.preview.length>240||!/^\d+$/.test(note.timestamp_ms))throw new Error('Metadati non validi');
        const raw=Uint8Array.from(note.receipt_hex.match(/../g),v=>parseInt(v,16)),view=new DataView(raw.buffer);
        if(view.getUint16(0,true)!==1||view.getBigUint64(10,true).toString()!==note.request||view.getBigUint64(18,true)===0n||hex(raw.slice(26,58))!==note.note_sha256||hex(raw.slice(90,106))!==note.id)throw new Error('Ricevuta storica non valida');
        const timestamp=new Date(Number(note.timestamp_ms));if(!Number.isFinite(timestamp.getTime()))throw new Error('Data non valida');
        if(!transactionIds.has(note.request)){transactionIds.add(note.request);receipts.unshift({...note,context:'Lavoro',timestamp});}
      }
      renderTimeline();window.dispatchEvent(new CustomEvent('vela:hydrated',{detail:{count:receipts.length}}));
    }
    function syncTimeline() {
      const channel=new WebSocket('ws://127.0.0.1:7990/');connection('connecting');
      const timeout=setTimeout(()=>{channel.close();connection('failed');toast('Cronologia non disponibile.');},20000);
      channel.onopen=()=>connection('connected');
      channel.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.type!=='ListResponse')throw new Error('Sincronizzazione non disponibile');hydrate(message);clearTimeout(timeout);channel.close();connection('idle');}catch{clearTimeout(timeout);channel.close();connection('failed');toast('Cronologia non disponibile.');}};
      channel.onerror=()=>{clearTimeout(timeout);connection('failed');toast('Cronologia non disponibile.');};
    }
    renderTimeline();syncTimeline();
  </script>
