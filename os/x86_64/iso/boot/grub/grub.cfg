set timeout=3
set default=0
insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,auto
terminal_output gfxterm
set menu_color_normal=white/blue
set menu_color_highlight=black/light-cyan

menuentry "VelaOS 0.2 (x86_64)" {
    multiboot2 /boot/vela.elf res=1920x1080
    boot
}
menuentry "VelaOS 0.2 - 1280x720 (small screens)" {
    multiboot2 /boot/vela.elf res=1280x720
    boot
}
menuentry "VelaOS 0.2 - safe graphics (firmware mode)" {
    multiboot2 /boot/vela.elf nomodeset
    boot
}
